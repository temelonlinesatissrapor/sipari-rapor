name: Siparişleri Çek

on:
  schedule:
    - cron: '17 3 * * *'
    - cron: '17 12 * * *'
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Başlangıç tarihi (YYYY-AA-GG) — geçmiş siparişleri yüklemek için. Boş = son 7 gün'
        required: false
      end_date:
        description: 'Bitiş tarihi (YYYY-AA-GG). Boş = bugün'
        required: false

permissions:
  contents: write

concurrency:
  group: siparis-cek
  cancel-in-progress: false

jobs:
  cek:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Entegra'dan siparişleri çek
        timeout-minutes: 50
        env:
          ENTEGRA_EMAIL: ${{ secrets.ENTEGRA_EMAIL }}
          ENTEGRA_PASSWORD: ${{ secrets.ENTEGRA_PASSWORD }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          DASHBOARD_USERS: ${{ secrets.DASHBOARD_USERS }}
          START_DATE: ${{ github.event.inputs.start_date }}
          END_DATE: ${{ github.event.inputs.end_date }}
        run: node scripts/fetch-orders.mjs

      - name: Verileri kaydet
        if: always()
        run: |
          git config user.name "siparis-botu"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -d docs/data ] || { echo "Kaydedilecek veri yok."; exit 0; }
          git add docs/data
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "Sipariş verisi güncellendi: $(TZ=Europe/Istanbul date '+%d.%m.%Y %H:%M')"
            git push
          fi
